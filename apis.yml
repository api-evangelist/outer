apis:
- aid: outer:ucp-shopping
  name: Outer UCP Shopping (MCP)
  description: 'The Universal Commerce Protocol shopping service Outer''s storefront exposes over MCP, advertised in the merchant profile at https://liveouter.com/.well-known/ucp. It carries the dev.ucp.shopping service with catalog search and lookup, cart, checkout, fulfillment, discount and order capabilities, plus Google Pay, Shopify Card and Shop Pay payment handlers. tools/list is not anonymous: the endpoint answers HTTP 422 invalid_profile_url until the calling agent supplies a resolvable UCP agent profile URI, so live tool input schemas require a registered agent identity. The tool names recorded in mcp/outer-mcp.yml are the ones Outer publishes in its own /llms.txt.'
  humanURL: https://liveouter.com/llms.txt
  baseURL: https://liveouter.com/api/ucp/mcp
